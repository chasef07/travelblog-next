version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    groups:
      next-stack:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - 'eslint-config-next'
          - '@next/*'
      ui-and-styling:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'framer-motion'
          - 'lucide-react'
      tooling:
        patterns:
          - 'eslint*'
          - '@types/*'
          - 'typescript'
